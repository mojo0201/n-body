[package]
name = "nbody-rust"
version = "0.1.0"
edition = "2021"
 
[lib]
name = "nbody_rust"
path = "src/lib.rs"
 
[[bin]]
name = "nbody-rust"
path = "src/main.rs"
 
[[bin]]
name = "find_planets"
path = "src/bin/find_planets.rs"
 
[dependencies]
bytemuck = { version = "1", features = ["derive"] }
egui = "0.37.0"
egui-wgpu = "0.37.0"
egui-winit = "0.37.0"
glam = "0.34.3"
num_cpus = "1"
pollster = "1.0.2"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
wgpu = "30.0.2"
winit = "0.30"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = 1
panic = "abort"
 
[profile.dev]
opt-level = 2
 
[profile.dev.package."*"]
opt-level = 3