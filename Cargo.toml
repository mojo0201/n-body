[package]
name = "nbody-rust"
version = "0.1.0"
edition = "2021"
 
[lib]
name = "nbody_rust"
path = "src/lib.rs"
 
[[bin]]
name = "nbody-rust"
path = "src/main.rs"
 
[[bin]]
name = "find_planets"
path = "src/bin/find_planets.rs"
 
[dependencies]
bytemuck = { version = "1", features = ["derive"] }
egui = "0.29"
egui-wgpu = "0.29"
egui-winit = "0.29"
glam = "0.29"
num_cpus = "1"
pollster = "0.4"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wgpu = "22"
winit = "0.30"
 
[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
 
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = 1
panic = "abort"
 
[profile.dev]
opt-level = 2
 
[profile.dev.package."*"]
opt-level = 3